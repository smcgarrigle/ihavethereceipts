name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "backend/pyproject.toml"

      - name: Install dependencies
        run: |
          cd backend
          uv sync

      - name: Run Ruff Check
        run: |
          cd backend
          uv run ruff check .

      - name: Run Mypy
        run: |
          cd backend
          uv run mypy .

      - name: Run Tests
        run: |
          cd backend
          uv run pytest
