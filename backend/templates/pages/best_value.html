{% extends "layouts/base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-6 flex justify-between items-center">
        <div class="flex items-center">
            <a href="/"
                class="mr-4 p-2 rounded-lg hover:bg-bgHover text-textMuted">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
            </a>
            <h1 class="text-3xl font-bold text-textBase">{{ title }}</h1>
        </div>
    </div>

    <div class="bg-bgCard rounded-xl shadow-lg border border-borderDefault overflow-hidden">
        <!-- Header (Desktop Only) -->
        <div class="hidden lg:grid lg:grid-cols-12 gap-4 bg-bgHover px-6 py-3 text-xs font-medium text-textMuted uppercase tracking-wider border-b border-borderDefault">
            <div class="col-span-4">Item Name</div>
            <div class="col-span-2 text-right">{{ unit_label }}</div>
            <div class="col-span-2 text-right">Price</div>
            {% if category_type == 'beverages' %}
            <div class="col-span-1 text-right">$/12oz</div>
            <div class="col-span-2 text-right">Store</div>
            {% else %}
            <div class="col-span-2 text-right">Store</div>
            {% endif %}
            <div class="col-span-1 text-right">Date</div>
        </div>

        <div id="best-value-rows" class="divide-y divide-gray-200 dark:divide-gray-700"
            hx-get="/api/analytics/tables/best-value/{{ category_type }}/rows" hx-trigger="load">
            <!-- Initial loading state -->
            <div class="px-6 py-12 text-center text-textMuted">
                <div class="flex justify-center">
                    <svg class="animate-spin h-8 w-8 text-blue-500" xmlns="http://www.w3.org/2000/svg"
                        fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                            stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                </div>
                <p class="mt-2 text-sm">Loading best prices...</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
