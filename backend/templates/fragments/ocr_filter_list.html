{% for item in items %}
<li id="ocr-{{ filter_type }}-{{ loop.index }}"
    class="flex items-center justify-between gap-3 px-4 py-2.5 rounded-lg bg-bgMain border border-borderDefault">
    <span class="text-sm font-mono text-textBase truncate">{{ item }}</span>
    <button hx-delete="/settings/exclusions/ocr/{{ filter_type }}?value={{ item | urlencode }}"
            hx-target="#{{ filter_type }}-list"
            hx-swap="innerHTML"
            class="flex-shrink-0 p-1.5 rounded-lg text-textMuted hover:text-red-400 hover:bg-red-500/10 transition-colors"
            title="Remove filter">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
    </button>
</li>
{% else %}
<li class="px-4 py-3 text-sm text-textMuted italic">No filters defined.</li>
{% endfor %}
