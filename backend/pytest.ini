[pytest]
pythonpath = .
asyncio_mode = strict
testpaths = tests
asyncio_default_fixture_loop_scope = function
markers =
    e2e: end-to-end tests needing a live server (opt in with: uv run pytest -m e2e)
    real_background_work: keep the real BulkProcessor/NutritionEnricher start and FDC enrichment task (conftest stubs them)
addopts = -m "not e2e"
