[project]
name = "ihavethereceipts"
version = "0.1.0"
description = "IHaveTheReceipts — grocery price tracker with AI-powered OCR"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.23",
    "alembic>=1.12.1",
    "openai>=1.0.0",
    "json-repair>=0.25.0",
    "google-genai>=0.1.0",
    "pillow>=10.1.0",
    "python-dotenv>=1.0.0",
    "pdf2image>=1.17.0",
    "rapidfuzz>=3.6.1",
    "pdfplumber>=0.11.9",
    "itsdangerous>=2.1.0",
    "pandas>=2.1.3",
    "openpyxl>=3.1.2",
    # Imported directly rather than reached through another package. All of
    # these resolved only as someone else's transitive — requests and tenacity
    # via google-genai, pydantic and starlette via fastapi, dateutil via pandas
    # — and README.md and CONTRIBUTING.md both recommend `uv lock --upgrade` as
    # routine maintenance, so the day an edge moved they would have failed at
    # import. tests/test_declared_dependencies.py keeps this list honest.
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "pydantic>=2.0.0",
    "starlette>=0.27.0",
    "python-dateutil>=2.8.2",
    # Imported directly by ocr.py for httpx.Timeout, so the local OCR client
    # can cap connecting separately from reading. Arrives as a transitive of
    # openai and fastapi, which is exactly why it needs declaring.
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # Keep in sync with the ruff-pre-commit rev in ../.pre-commit-config.yaml.
    "ruff>=0.16.1",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
    "types-pillow>=10.2.0.20240213",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
    "axe-core-python>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["scripts/", "scratch/", "alembic/versions/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (common in FastAPI)
]

[tool.ruff.lint.per-file-ignores]
# main.py interleaves imports with wiring on purpose: load_dotenv() must run
# before app.* imports read env vars, and middleware imports follow app creation.
"app/main.py" = ["E402"]
# alembic/env.py: alembic config setup must precede app model imports.
"alembic/env.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
# No explicit python_version: mypy follows the interpreter it runs under.
# numpy ships 2.4.x for py3.11 and 2.5.x (whose stubs need 3.12+ syntax) for
# py3.12+, so a hardcoded version mismatches whichever numpy is installed.
# CI runs the 3.11 floor from requires-python, so 3.11 compat is still guarded.
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# Permanently exclude one-off scripts and frozen migration history
exclude = [
    "scratch/",
    "scripts/",
    "alembic/versions/",
    "tests/test_zero_qty_fix\\.py",
]

# ---------------------------------------------------------------------------
# Temporary ratchet overrides — remove as each file is cleaned.
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = [
    "app.api.analytics",
    "app.api.analytics_fragments",
    "app.api.items",
    "app.api.pages",
    "app.api.receipts",
    "app.api.receipts_fragments",
    "app.api.receipts_review",
    "app.api.trends",
    "app.api.xray",
]
ignore_errors = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["templates*", "static*", "alembic*"]
