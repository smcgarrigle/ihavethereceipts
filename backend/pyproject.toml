[project]
name = "grocery-tracker"
version = "0.1.0"
description = "Grocery price tracker with HTMX frontend"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.2",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.23",
    "alembic>=1.12.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "openai>=1.0.0",
    "json-repair>=0.25.0",
    "google-genai>=0.1.0",
    "pillow>=10.1.0",
    "python-Levenshtein>=0.23.0",
    "fuzzywuzzy>=0.18.0",
    "python-dotenv>=1.0.0",
    "pdf2image>=1.17.0",
    "rapidfuzz>=3.6.1",
    "pdfplumber>=0.11.9",
    "itsdangerous>=2.1.0",
    "pandas>=2.1.3",
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
    "types-pillow>=10.2.0.20240213",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (common in FastAPI)
]

[tool.ruff.lint.per-file-ignores]
# main.py interleaves imports with wiring on purpose: load_dotenv() must run
# before app.* imports read env vars, and middleware imports follow app creation.
"app/main.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# Permanently exclude one-off scripts and frozen migration history
exclude = [
    "scratch/",
    "scripts/",
    "alembic/versions/",
    "tests/test_zero_qty_fix\\.py",
]

# ---------------------------------------------------------------------------
# Temporary ratchet overrides — remove each module line once it is clean.
# (Step 1 of mypy backlog clearance — see TODO_MYPY.md)
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = [
    "app.api.analytics",
    "app.api.analytics_bi_injection",
    "app.api.analytics_fragments",
    "app.api.bulk",
    "app.api.export",
    "app.api.items",
    "app.api.pages",
    "app.api.receipts",
    "app.api.receipts_fragments",
    "app.api.receipts_review",
    "app.api.settings_router",
    "app.api.templates",
    "app.api.trends",
    "app.api.trends_nutrition",
    "app.api.xray",
    "app.main",
    "app.middleware",
    "app.models.item",
    "app.services.category_cache",
    "app.services.external_product",
    "app.services.fdc_service",
    "app.services.folder_watch",
    "app.services.item_matcher",
    "app.services.model_manager",
    "app.services.ocr",
    "app.services.onboarding",
    "app.services.pdf_parser",
    "app.services.predictions",
]
ignore_errors = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["templates*", "static*", "alembic*"]
